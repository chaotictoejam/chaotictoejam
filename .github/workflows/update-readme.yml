name: Update README content feeds
on:
  schedule:
    - cron: '0 9 * * *'   # daily at 9am UTC
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update articles (dev.to + Substack, custom fetch)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

          curl -s -A "$UA" "https://dev.to/feed/drjoanneskiles" -o devto.xml

          # Substack RSS directly; rss2json is only a fallback (it now sits behind a Cloudflare challenge)
          curl -sL -A "$UA" "https://chaotictoejam.substack.com/feed" -o substack.xml || true
          curl -s "https://api.rss2json.com/v1/api.json?rss_url=https://chaotictoejam.substack.com/feed" -o substack.json || true
          echo "--- substack.xml preview ---"
          head -c 300 substack.xml || true
          echo

          node -e '
            const fs = require("fs");

            // A broken feed should skip that source, not fail the whole run
            function safely(label, fn) {
              try {
                return fn();
              } catch (e) {
                console.log(`::warning::${label} skipped: ${e.message}`);
                return [];
              }
            }

            function parseRss(path, source) {
              const xml = fs.readFileSync(path, "utf8");
              if (!/<rss[\s>]/.test(xml)) throw new Error(`${path} is not an RSS feed`);
              return [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)]
                .filter(m => !/<enclosure[^>]*type="audio/.test(m[1]))
                .map(m => {
                  const title = m[1].match(/<title>([\s\S]*?)<\/title>/)?.[1]
                    .replace(/^<!\[CDATA\[|\]\]>$/g, "").trim();
                  const link = m[1].match(/<link>([\s\S]*?)<\/link>/)?.[1].trim();
                  const pubDate = m[1].match(/<pubDate>([\s\S]*?)<\/pubDate>/)?.[1].trim();
                  return { title, link, date: new Date(pubDate), source };
                });
            }

            function parseRss2json(path, source) {
              const data = JSON.parse(fs.readFileSync(path, "utf8"));
              if (data.status !== "ok") throw new Error(`rss2json error: ${JSON.stringify(data)}`);
              return (data.items || [])
                .filter(item => !item.enclosure?.type?.startsWith("audio"))
                .map(item => ({
                  title: item.title,
                  link: item.link,
                  date: new Date(item.pubDate),
                  source,
                }));
            }

            const devto = safely("Dev.to", () => parseRss("devto.xml", "Dev.to"));
            let substack = safely("Substack RSS", () => parseRss("substack.xml", "Substack"));
            if (!substack.length) substack = safely("Substack rss2json", () => parseRss2json("substack.json", "Substack"));

            const decode = s => s
              .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(n))
              .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
              .replace(/&quot;/g, "\"").replace(/&apos;/g, "\x27")
              .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");

            // Same article cross-posted to both sources: match on a normalized title
            const key = s => s.toLowerCase()
              .replace(/[‘’]/g, "\x27").replace(/[“”]/g, "\"")
              .replace(/\s+/g, " ").trim();

            const groups = new Map();
            for (const p of [...devto, ...substack]) {
              if (!p.title || !p.link) continue;
              const title = decode(p.title);
              const k = key(title);
              const g = groups.get(k) ?? { title, date: p.date, links: [] };
              if (p.date > g.date) g.date = p.date;
              g.links.push(p);
              groups.set(k, g);
            }

            const order = ["Dev.to", "Substack"];
            const combined = [...groups.values()]
              .sort((a, b) => b.date - a.date)
              .slice(0, 5)
              .map(g => {
                const links = g.links
                  .sort((a, b) => order.indexOf(a.source) - order.indexOf(b.source))
                  .map(p => `([${p.source}](${p.link}))`)
                  .join(" ");
                return `- ${g.title} ${links}`;
              })
              .join("\n");

            if (!combined) {
              console.log("::warning::No articles fetched; leaving README unchanged");
              process.exit(0);
            }

            const readme = fs.readFileSync("README.md", "utf8");
            const updated = readme.replace(
              /<!-- ARTICLES:START -->[\s\S]*?<!-- ARTICLES:END -->/,
              `<!-- ARTICLES:START -->\n${combined}\n<!-- ARTICLES:END -->`
            );
            fs.writeFileSync("README.md", updated);
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Updated with the latest articles"
          git push

      - name: Update videos
        # YouTube's feed endpoint 404s for every channel on and off; keep the old list and carry on
        continue-on-error: true
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "VIDEOS"
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UC0fsRDyOi52N3GeInLIz6lA"
          max_post_count: "5"
          template: "$newline- [$title]($url)$newline"

      - name: Update podcasts (custom fetch, tolerates items without <link>)
        run: |
          curl -sL "https://media.chaotictoejam.com/chaoticcommits/feed.xml" -o chaoticcommits.xml
          curl -sL "https://anchor.fm/s/10e91d00c/podcast/rss" -o hercareer.xml

          node -e '
            const fs = require("fs");

            const text = s => s?.replace(/^\s*<!\[CDATA\[|\]\]>\s*$/g, "").trim();

            function parseRss(path) {
              const xml = fs.readFileSync(path, "utf8");
              const channelLink = text(xml.split("<item>")[0].match(/<link>([\s\S]*?)<\/link>/)?.[1]);
              return [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)].map(m => {
                const title = text(m[1].match(/<title>([\s\S]*?)<\/title>/)?.[1]);
                const link = text(m[1].match(/<link>([\s\S]*?)<\/link>/)?.[1]) || channelLink;
                const pubDate = text(m[1].match(/<pubDate>([\s\S]*?)<\/pubDate>/)?.[1]);
                return { title, link, date: new Date(pubDate) };
              }).filter(p => p.title && p.link);
            }

            const combined = [...parseRss("chaoticcommits.xml"), ...parseRss("hercareer.xml")]
              .sort((a, b) => b.date - a.date)
              .slice(0, 5)
              .map(p => `- [${p.title.replace(/[\[\]]/g, "\\$&")}](${p.link})`)
              .join("\n\n");

            const readme = fs.readFileSync("README.md", "utf8");
            const updated = readme.replace(
              /<!-- PODCASTS:START -->[\s\S]*?<!-- PODCASTS:END -->/,
              `<!-- PODCASTS:START -->\n${combined}\n<!-- PODCASTS:END -->`
            );
            fs.writeFileSync("README.md", updated);
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Updated with the latest podcast episodes"
          git push
